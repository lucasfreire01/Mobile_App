services:
  postgres:
    image: postgres:17-alpine
    container_name: browan-postgres
    restart: unless-stopped
    # Bootstrap/migration administrator is separate from the API/worker DB_* role.
    env_file:
      - .env.database-admin
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - browan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  browan_postgres_data:
